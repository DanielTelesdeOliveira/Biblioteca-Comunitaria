<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Biblioteca - Detalhes do Livro</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .disabled {
      opacity: 0.5;
      cursor: not-allowed !important;
    }
  </style>
</head>

<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">B</div>
      <div class="logo-text">
        <h1>Biblioteca Comunitária</h1>
        <small>Detalhes do livro</small>
      </div>
    </div>
    <nav>
      <a class="nav-link" href="home.html">Início</a>
      <a class="nav-link" href="consulta.html">Consultar livros</a>
      <a class="nav-link" href="cadastro-livro.html">Cadastrar livro</a>
      <a class="nav-link primary" href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <div>
          <div class="card-title" id="detTitulo">Carregando...</div>
          <div class="card-subtitle" id="detSubtitulo"></div>
        </div>
        <span class="pill" id="detStatusPill">-</span>
      </div>

      <p class="helper-text" id="detId"></p>

      <div class="form-grid" style="margin-top:10px;">
        <div class="field-group">
          <label for="inpTitulo">Título</label>
          <input id="inpTitulo" disabled />
        </div>

        <div class="field-group">
          <label for="inpAutor">Autor</label>
          <input id="inpAutor" disabled />
        </div>

        <div class="field-group">
          <label for="inpCategoria">Categoria</label>
          <input id="inpCategoria" disabled />
        </div>
      </div>

      <div class="field-group" style="margin-top:10px;">
        <label for="inpGenero">Gênero</label>
        <select id="inpGenero" disabled>
          <option>Carregando...</option>
        </select>
      </div>

      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-primary" id="btnEmprestimo">Pedir empréstimo</button>
        <button class="btn btn-ghost" id="btnAtualizar">Atualizar dados</button>
        <button class="btn btn-ghost" id="btnRemover">Remover livro</button>
        <a class="btn btn-ghost" href="consulta.html">Voltar à consulta</a>
      </div>

      <p id="msgEmprestimo" class="helper-text"></p>
      <p id="msgAtualizar" class="helper-text"></p>
      <p id="msgRemover" class="helper-text error-text"></p>
    </section>
  </main>
</div>

<script>
  const API_BASE = "http://localhost:8080";

  let livro = null;
  let modoEdicao = false;

  const btnEmprestimo = document.getElementById("btnEmprestimo");
  const msgEmprestimo = document.getElementById("msgEmprestimo");

  btnEmprestimo.addEventListener("click", () =>{
      limparMensagem();
      msgEmprestimo.textContent = "Simulação de emprestimo Completa!";
      msgEmprestimo.classList.remove("error-text");
  })

  function bloquearCampos() {
    inpTitulo.disabled = true;
    inpAutor.disabled = true;
    inpCategoria.disabled = true;
    inpGenero.disabled = true;
  }

  function liberarCampos() {
    inpTitulo.disabled = false;
    inpAutor.disabled = false;
    inpCategoria.disabled = false;
    inpGenero.disabled = false;
  }

  function limparMensagem() {
    msgEmprestimo.textContent = "";
    msgAtualizar.textContent = "";
  }

  bloquearCampos();

  function getIdFromUrl() {
    return new URLSearchParams(window.location.search).get("id");
  }

  async function carregarGenerosSelect() {
    const sel = document.getElementById("inpGenero");
    sel.innerHTML = "<option>Carregando...</option>";

    try {
      const resp = await fetch(API_BASE + "/generos/lista");
      if (!resp.ok) throw new Error();

      const generos = await resp.json();
      sel.innerHTML = "<option value=''>Selecione um gênero</option>";

      generos.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g.id;
        opt.textContent = g.nome;
        sel.appendChild(opt);
      });

      if (livro?.genero?.id) sel.value = livro.genero.id;

    } catch (e) {
      sel.innerHTML = "<option value=''>Erro ao carregar gêneros</option>";
    }
  }

  async function carregarLivro() {
    const id = getIdFromUrl();
    if (!id) return;

    try {
      const resp = await fetch(API_BASE + "/livros/" + id);
      if (!resp.ok) throw new Error();

      livro = await resp.json();

      detTitulo.textContent = livro.titulo;
      detSubtitulo.textContent = livro.autor ? "por " + livro.autor : "";
      detId.textContent = "ID: " + livro.id;

      inpTitulo.value = livro.titulo;
      inpAutor.value = livro.autor;
      inpCategoria.value = livro.categoria ?? "";

      await carregarGenerosSelect();

      detStatusPill.textContent = "Disponível";
      detStatusPill.classList.add("green");

    } catch (e) {
      detTitulo.textContent = "Erro ao carregar livro";
    }
  }

  async function salvarAlteracoesLivro() {
    const msg = msgAtualizar;
    msg.textContent = "";

    const novoTitulo = inpTitulo.value.trim();
    const novoAutor = inpAutor.value.trim();
    const novaCategoria = inpCategoria.value.trim();
    const novoGeneroId = inpGenero.value;

    if (!novoTitulo || !novoAutor) {
      msg.textContent = "Título e autor são obrigatórios.";
      msg.classList.add("error-text");
      return;
    }

    const livroReq = {
      titulo: novoTitulo,
      autor: novoAutor,
      categoria: novaCategoria,
      genero: { id: Number(novoGeneroId) }
    };

    try {
      const resp = await fetch(`${API_BASE}/livros/atualizar/${livro.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(livroReq)
      });

      if (!resp.ok) throw new Error();

      livro = await resp.json();

      bloquearCampos();
      modoEdicao = false;
      btnAtualizar.textContent = "Atualizar dados";


      btnEmprestimo.disabled = false;
      btnEmprestimo.classList.remove("disabled");
      btnRemover.disabled = false;
      btnRemover.classList.remove("disabled");

      msg.classList.remove("error-text");
      msg.textContent = "Livro atualizado com sucesso!";
    } catch (e) {
      msg.textContent = "Erro ao atualizar livro.";
      msg.classList.add("error-text");
    }
  }

  btnAtualizar.addEventListener("click", () => {
    limparMensagem();
    if (!modoEdicao) {
      modoEdicao = true;
      liberarCampos();
      carregarGenerosSelect();
      btnAtualizar.textContent = "Salvar alterações";

      
      btnEmprestimo.disabled = true;
      btnEmprestimo.classList.add("disabled");
      btnRemover.disabled = true;
      btnRemover.classList.add("disabled");

      return;
    }

    salvarAlteracoesLivro();
  });

  btnRemover.addEventListener("click", async () => {
    limparMensagem();
    if (!confirm("Deseja realmente remover este livro?")) return;

    try {
      const resp = await fetch(`${API_BASE}/livros/delete/${livro.id}`, {
        method: "DELETE"
      });

      if (!resp.ok) throw new Error();

      alert("Livro removido!");
      window.location.href = "consulta.html";

    } catch (e) {
      msgRemover.textContent = "Erro ao remover livro.";
    }
  });

  carregarLivro();
</script>
</body>
</html>
